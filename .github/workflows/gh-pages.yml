# ============================================================
# GitHub Actions Workflow: Deploy documentation
#
# This workflow builds the project documentation using
# Jupyter Book and deploys the generated HTML pages to
# GitHub Pages.
#
# Trigger:
#   - Runs automatically when files under gh-pages/** are pushed
#     to the main branch.
#
# Workflow steps:
#   1. Checkout repository source code.
#   2. Set up Python environment.
#   3. Install documentation dependencies.
#   4. Synchronize required static files.
#   5. Build documentation with Jupyter Book.
#   6. Upload generated HTML as a GitHub Pages artifact.
#   7. Deploy the artifact to GitHub Pages.
#
# The deployed documentation will be available at:
#   https://github.com/YunshuangXiao/embrith
#
# ============================================================

name: deploy gh pages

on:
  push:
    branches: [main]
    paths:
      - "gh-pages/**"
      - "README.md"
      - "README_EN.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r gh-pages/requirements.txt

      - name: Build gh-pages
        run: jupyter-book build gh-pages

      - name: Add Google Verification HTML
        run: |
          echo "google-site-verification: googlec9e4940b93eddd8a.html" > gh-pages/_build/html/googlec9e4940b93eddd8a.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4