# embrith settings (shell syntax)
UI_MODE=stop     # default for testing: framework stopped (--framework_stop). pause = keep lab126_gui running (powerd events and the power button stay with the Kindle), only freeze its drawing like KOReader (old default); stop = stop lab126_gui too (old behaviour); none = leave it alone
TOUCH_GRAB=1      # 1 = kgest grabs the touch screen and hands Android a copy (embrith-touch), the Kindle sees no touches; 0 = shared (old)
UI_SERVICES=""    # extra Kindle services to stop while Android runs and start again afterwards, e.g. "stored webreader kfxreader kfxview todo tmd rcm archive scanner" (frees RAM; "mtp" also disables USB file transfer)
ZRAM_MB=auto      # compressed swap size in MB: auto = 50% of the RAM (read at start), 0 = off
BOOT_TIMEOUT=300  # seconds to wait for sys.boot_completed
RUN_LIMIT=300     # test mode: stop everything automatically after this many seconds (0 = never)
BINDER_DEV=auto   # binder device for Android: auto = first unused of hwbinder/vndbinder (never /dev/binder: the Kindle uses it)
STAY_AFTER_BOOT=60 # short test mode (limit <= 300 s) only: seconds to keep running after sys.boot_completed. Longer runs use their full limit
FL_AUTO_PROP="flAuto"     # powerd property for "auto brightness"; empty = guess from lipc-probe (see logs/lipc-powerd.txt after `embrith.sh icons`)
HOST_PROTECT="powerd lipcd wifid sshd dropbear wpa_supplicant"   # Kindle processes kept away from the OOM killer, each one is used by embrith: powerd/lipcd (sleep, brightness, lipc), wifid (wifi join), btfd (bluetooth), appmgrd (back to home), dropbear (ssh), wpa_supplicant (wifid helper). Names that do not run are skipped. kdispd and kgest are always guarded
OOM_ADJ=-800       # oom_score_adj given to those processes (-1000 = never killed; empty = no protection at all)
DATA_IMG_MB=1024  # ext4 /data image size in MB when /mnt/base-us is not ext4 (e.g. VFAT on Scribe; must stay under 4095 MB on FAT32)
