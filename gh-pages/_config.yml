# Book settings
title: Embrith
authors: Embrith Contributors.

# Execution settings
execute:
  execute_notebooks: "off"

# HTML settings
html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

# Repository information
repository:
  url: https://github.com/yunshuangxiao/embrith
  path_to_book: .
  branch: main

sphinx:
  config:
    project: "Embrith"

    include_patterns:
      - "**"
      - "../README.md"
      - "../README_EN.md"

    html_context:
      github_user: yunshuangxiao
      github_repo: embrith
      github_version: main
      doc_path: gh-pages
      metatags: |
        <meta name="google-site-verification" content="WanrbQ8ku3mQnYbG4fJIxAHGiZaS8ZZ-i5Vk4QQl4BM" />
        <meta name="description" content="Open-source Android 7.1.2 system for jailbroken Kindle e-readers. Install APKs and read on E Ink." />

    html_title: "Embrith - Android for Kindle (open-source AOSP system)"

    html_meta:
      google-site-verification: "WanrbQ8ku3mQnYbG4fJIxAHGiZaS8ZZ-i5Vk4QQl4BM"

    html_show_sourcelink: false

    html_theme: piccolo_theme

    html_static_path: ['_static']
    html_css_files: [
        'css/custom.css',
    ]
    html_js_files: [
        'js/navbar.js',
    ]
